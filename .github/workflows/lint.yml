name: Lint

on:
  push:
  pull_request:

env:
  GOFLAGS: -mod=readonly

jobs:
  lint:
    name: Lint
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download modules
        run: go mod download

      # lintConfig fetches a JSON schema from golangci-lint.run to validate the
      # config. That host is not always reachable from the runner, and a failed
      # fetch must not fail the build — the linter run below is the real gate.
      - name: Check linter configuration
        id: lintconfig
        continue-on-error: true
        run: go run mage.go lintConfig

      - name: Run linter
        run: go run mage.go lint

      - name: Summary
        if: always()
        run: |
          {
            echo "## Lint"
            echo
            echo "- Go: \`$(go version | awk '{print $3}')\`"
            echo "- golangci-lint: ${{ job.status == 'success' && '✅ clean' || '❌ findings' }}"
            case "${{ steps.lintconfig.outcome }}" in
              success) echo "- Config schema check: ✅ valid" ;;
              failure) echo "- Config schema check: ⚠️ skipped (schema host unreachable — non-fatal)" ;;
              *)       echo "- Config schema check: — not run" ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
