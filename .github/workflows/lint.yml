name: Lint

on:
  push:
  pull_request:

env:
  GOFLAGS: -mod=readonly

jobs:
  lint:
    name: Lint
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Cache bin/, where mage builds the custom golangci-lint (with plugins)
      # and installs its tools. Building that binary is the slowest step; a
      # cold runner rebuilds it every run.
      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: bin
          key: ${{ runner.os }}-tools-${{ hashFiles('magefiles/tools.go', '.custom-gcl.yml', 'go.mod') }}
          restore-keys: |
            ${{ runner.os }}-tools-

      - name: Download modules
        run: go mod download

      # lintConfig fetches a JSON schema from golangci-lint.run to validate the
      # config. That host is not always reachable from the runner, and a failed
      # fetch must not fail the build — the linter run below is the real gate.
      - name: Check linter configuration
        id: lintconfig
        continue-on-error: true
        run: go run mage.go lintConfig

      - name: Run linter
        run: go run mage.go lint

      - name: Summary
        if: always()
        run: |
          {
            echo "## Lint"
            echo
            echo "- Go: \`$(go version | awk '{print $3}')\`"
            echo "- golangci-lint: ${{ job.status == 'success' && '✅ clean' || '❌ findings' }}"
            case "${{ steps.lintconfig.outcome }}" in
              success) echo "- Config schema check: ✅ valid" ;;
              failure) echo "- Config schema check: ⚠️ skipped (schema host unreachable — non-fatal)" ;;
              *)       echo "- Config schema check: — not run" ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
