name: E2E Tests

on:
  push:
  pull_request:

jobs:
  test-e2e:
    name: Run on Ubuntu
    runs-on: self-hosted
    timeout-minutes: 40
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Create the kind cluster with parallel image pulls
        run: |
          # The suite reuses a cluster of this name if it already exists, so
          # create it here from the config that pulls images in parallel. A
          # serialized pull of the suite's images is what times the job out.
          kind create cluster \
            --name secure-software-supply-chain-test-e2e \
            --config hack/kind-cluster.yaml

      - name: Running Test e2e
        run: |
          go mod tidy
          go run mage.go testE2E

      - name: Upload JUnit results for Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-e2e
          path: test-results/
          if-no-files-found: warn
