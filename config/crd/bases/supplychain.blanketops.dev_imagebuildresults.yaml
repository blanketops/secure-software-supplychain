---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: imagebuildresults.supplychain.blanketops.dev
spec:
  group: supplychain.blanketops.dev
  names:
    kind: ImageBuildResult
    listKind: ImageBuildResultList
    plural: imagebuildresults
    shortNames:
    - ibr
    singular: imagebuildresult
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.imageURL
      name: ImageURL
      type: string
    - jsonPath: .status.imageDigest
      name: Digest
      type: string
    - jsonPath: .status.completedAt
      name: CompletedAt
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ImageBuildResult is the durable record of a completed ImageBuild execution.
          Survives PipelineRun pruning. One ImageBuildResult per ImageBuild.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ImageBuildResultSpec defines the desired state of ImageBuildResult.
            properties:
              imageBuildRef:
                description: ImageBuildRef references the ImageBuild that produced
                  this result.
                properties:
                  name:
                    description: Name of the object.
                    type: string
                required:
                - name
                type: object
              pipelineRunRef:
                description: PipelineRunRef references the Tekton PipelineRun that
                  was executed.
                properties:
                  name:
                    description: Name of the object.
                    type: string
                required:
                - name
                type: object
            required:
            - imageBuildRef
            - pipelineRunRef
            type: object
          status:
            description: ImageBuildResultStatus defines the observed state of ImageBuildResult.
            properties:
              buildResults:
                description: |-
                  BuildResults contains the full structured output of all pipeline steps.
                  Populated from PipelineRun results — covers git, build, security, attestation.
                properties:
                  commit:
                    description: Commit is the full git commit SHA cloned.
                    type: string
                  committerDate:
                    description: CommitterDate is the date of the commit.
                    type: string
                  grafeasOccurrence:
                    description: |-
                      GrafeasOccurrence is the Grafeas occurrence name for this build event.
                      e.g. projects/blanketops/occurrences/abc123
                    type: string
                  imageDigest:
                    description: ImageDigest is the content-addressable digest of
                      the built image.
                    type: string
                  imageURL:
                    description: ImageURL is the fully-qualified image reference that
                      was built and pushed.
                    type: string
                  repoURL:
                    description: RepoURL is the git repository URL.
                    type: string
                  sonarGateStatus:
                    description: SonarGateStatus is the SonarQube quality gate result.
                    type: string
                  trivyCriticalCount:
                    description: TrivyCriticalCount is the number of CRITICAL vulnerabilities
                      found.
                    type: string
                  trivyHighCount:
                    description: TrivyHighCount is the number of HIGH vulnerabilities
                      found.
                    type: string
                  trivySarifPath:
                    description: TrivySarifPath is the path to the SARIF report in
                      the workspace.
                    type: string
                  trivyScanSummary:
                    description: TrivyScanSummary is PASS or FAIL from the Trivy vulnerability
                      scan.
                    type: string
                  trivyTotalCount:
                    description: TrivyTotalCount is the total HIGH+CRITICAL count.
                    type: string
                type: object
              completedAt:
                description: CompletedAt is the timestamp when the PipelineRun reached
                  a terminal state.
                format: date-time
                type: string
              conditions:
                description: Conditions represent the current state of the ImageBuildResult
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              imageDigest:
                description: |-
                  ImageDigest is the content-addressable digest of the built image.
                  Kept at the top level for quick access — also in BuildResults.
                type: string
              imageURL:
                description: |-
                  ImageURL is the fully-qualified image reference that was built.
                  Kept at the top level for quick access — also in BuildResults.
                type: string
              phase:
                description: Phase is the terminal phase of the build execution.
                enum:
                - Succeeded
                - Failed
                - Unknown
                type: string
              pipelineRunName:
                description: |-
                  PipelineRunName is the name of the Tekton PipelineRun that was executed.
                  Stored here so the result remains useful after PipelineRun pruning.
                type: string
              reason:
                description: Reason is the machine-readable reason for the terminal
                  phase.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
