                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              imageDigest:
                description: ImageDigest is the sha256 digest of the built image.
                type: string
              imageRef:
                description: |-
                  ImageRef is the fully qualified image reference produced by this build
                  e.g. ttl.sh/secure-software-:abc1234
                type: string
              phase:
                description: Phase is the overall build phase.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                type: string
              pipelineRunRef:
                description: PipelineRunRef is the name of the Tekton PipelineRun
                  driving this build.
                type: string
              signedBy:
                description: SignedBy is the principal identity from the Fulcio cert.
                type: string
              signingCertPEM:
                description: SigningCertPEM is the Fulcio ephemeral cert used for
                  signing.
                type: string
              startTime:
                description: StartTime is when the build began.
                format: date-time
                type: string
              steps:
                description: Steps tracks the status of each pipeline step.
                items:
                  description: StepStatus tracks an individual pipeline step.
                  properties:
                    completionTime:
                      description: CompletionTime is when this step finished.
                      format: date-time
                      type: string
                    message:
                      description: Message holds any human-readable detail about the
                        step outcome.
                      type: string
                    name:
                      description: Name is the step name (e.g. git-clone, kaniko,
                        trivy, sign).
                      type: string
                    phase:
                      description: Phase is the step phase.
                      enum:
                      - Pending
                      - Running
                      - Succeeded
                      - Failed
                      - Skipped
                      type: string
                    startTime:
                      description: StartTime is when this step started.
                      format: date-time
                      type: string
                  required:
                  - name
                  - phase
                  type: object
                type: array
            type: object
