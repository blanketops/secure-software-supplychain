---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: imagebuilds.supplychain.blanketops.dev
spec:
  group: supplychain.blanketops.dev
  names:
    kind: ImageBuild
    listKind: ImageBuildList
    plural: imagebuilds
    shortNames:
    - ib
    singular: imagebuild
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.supplyChainRef.name
      name: SupplyChain
      type: string
    - jsonPath: .spec.gitRef.revision
      name: Revision
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.imageRef
      name: Image
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ImageBuild is the Schema for the imagebuilds API.
          An ImageBuild is a single execution of a SupplyChain pipeline.
          Create one manually to trigger a build, or let a SupplyChain controller create it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ImageBuildSpec defines the desired state of ImageBuild.
            properties:
              gitRef:
                description: GitRef defines the git reference to build from.
                properties:
                  revision:
                    default: main
                    description: Revision is the git revision (branch, tag, or SHA).
                    type: string
                  sha:
                    description: SHA is the exact commit SHA — populated by the controller
                      after clone.
                    type: string
                  url:
                    description: 'URL is the git repository URL (SSH format: git@github.com:owner/repo.git).'
                    type: string
                required:
                - url
                type: object
              imageTag:
                description: ImageTag overrides the tag strategy from the SupplyChain
                  for this specific build.
                type: string
              supplyChainRef:
                description: |-
                  SupplyChainRef references the SupplyChain that owns this build.
                  Set automatically when the SupplyChain controller creates an ImageBuild,
                  or set manually to trigger a build against a specific SupplyChain.
                properties:
                  name:
                    description: Name of the object.
                    type: string
                required:
                - name
                type: object
            required:
            - gitRef
            - supplyChainRef
            type: object
          status:
            description: ImageBuildStatus defines the observed state of ImageBuild.
            properties:
              completionTime:
                description: CompletionTime is when the build finished (success or
                  failure).
                format: date-time
                type: string
              conditions:
                description: |-
                  Conditions represent the current state of the ImageBuild resource.

                  Standard condition types:
                    - "Available":   the resource is fully functional.
                    - "Progressing": the resource is being created or updated.
                    - "Degraded":    the resource failed to reach or maintain its desired state.

                  Each condition status is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
