---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: imagesignatures.supplychain.blanketops.dev
spec:
  group: supplychain.blanketops.dev
  names:
    kind: ImageSignature
    listKind: ImageSignatureList
    plural: imagesignatures
    shortNames:
    - ims
    singular: imagesignature
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.image
      name: Image
      type: string
    - jsonPath: .status.subject
      name: Signer
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.rekorLogIndex
      name: RekorIndex
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ImageSignature is the audit record of the build's own signature on an
          image: who signed, with which certificate, and where the transparency log
          recorded it. Created Pending when a build starts and completed from the
          registry and the log once the build has signed.
          Owned by the ImageBuild — deleted when the ImageBuild is deleted.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ImageSignatureSpec defines the desired state of ImageSignature.
              Created by the ImageBuildReconciler after a successful PipelineRun.
              Carries the full signing identity and transparency log references.
            properties:
              digest:
                description: |-
                  Digest is the content-addressable digest of the image at time of signing.
                  e.g. sha256:abc123...
                type: string
              fulcioURL:
                description: FulcioURL is the Fulcio CA that issued the ephemeral
                  signing certificate.
                type: string
              image:
                description: |-
                  Image is the fully qualified image reference that was signed.
                  e.g. docker.io/nkanyezisolutions/for-kaniko-app:abc123
                type: string
              imageBuild:
                description: ImageBuild is the name of the ImageBuild that produced
                  this signature.
                type: string
              rekorURL:
                description: RekorURL is the Rekor transparency log where the signature
                  was recorded.
                type: string
              signedBy:
                description: |-
                  SignedBy is the ServiceAccount the build runs and signs as, the
                  principal the three authorization checks were made for. The identity
                  in the signing certificate is in status.subject.
                  e.g. system:serviceaccount:default:supply-chain-runner
                type: string
              supplyChain:
                description: SupplyChain is the name of the SupplyChain that governed
                  this build.
                type: string
            required:
            - digest
            - fulcioURL
            - image
            - imageBuild
            - rekorURL
            - signedBy
            - supplyChain
            type: object
          status:
            description: |-
              ImageSignatureStatus defines the observed state of ImageSignature.

              Everything about the signature here is read back from where it is kept:
              the signature stored next to the image in the registry, and its entry in
              the transparency log. None of it is what the controller expects to be true.
            properties:
              certificate:
                description: |-
                  Certificate is the PEM-encoded Fulcio certificate that signed the
                  image, as stored with the signature. Its private key was made for
                  that one signature and discarded.
                type: string
              certificateFingerprint:
                description: CertificateFingerprint is the SHA-256 of that certificate.
                type: string
              conditions:
                description: Conditions represent the current state of the ImageSignature
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              issuer:
                description: Issuer is the OIDC issuer Fulcio verified that identity
                  against.
                type: string
              keyFingerprint:
                description: KeyFingerprint is the SHA-256 of the public key in it.
                type: string
              phase:
                description: |-
                  Phase is Signed only once the build's signature has been found on the
                  image together with its transparency log entry. A build that succeeded
                  but whose signature could not be read stays Pending.
                enum:
                - Pending
                - Signed
                - Failed
                type: string
              rekorLogID:
                description: RekorLogID identifies the log, by the SHA-256 of its
                  public key.
                type: string
              rekorLogIndex:
                description: |-
                  RekorLogIndex is the index of the signature's entry in the transparency
                  log. Unset until the entry has been found.
                format: int64
                type: integer
              signedAt:
                description: SignedAt is when the transparency log accepted the signature.
                format: date-time
                type: string
              subject:
                description: Subject is the identity in the certificate that signed
                  the image.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
