---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: supplychainpolicies.supplychain.blanketops.dev
spec:
  group: supplychain.blanketops.dev
  names:
    kind: SupplyChainPolicy
    listKind: SupplyChainPolicyList
    plural: supplychainpolicies
    shortNames:
    - scp
    singular: supplychainpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.supplyChainRef.name
      name: SupplyChain
      type: string
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.signers[*].subject
      name: Signers
      priority: 1
      type: string
    - jsonPath: .status.rekorURL
      name: Rekor
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SupplyChainPolicy is the Schema for the supplychainpolicies API.
          It is the admission side of a SupplyChain: one SupplyChainPolicy renders a
          sigstore policy-controller TrustRoot and the ClusterImagePolicies that only
          admit images the referenced SupplyChain signed keylessly and attested as
          authorized.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of SupplyChainPolicy
            properties:
              mode:
                default: enforce
                description: |-
                  mode is what happens to a workload whose image fails verification:
                  "enforce" rejects it, "warn" admits it with a warning.
                enum:
                - enforce
                - warn
                type: string
              serviceAccountName:
                default: supply-chain-policy-runner
                description: |-
                  serviceAccountName is the ServiceAccount this policy is rendered on behalf
                  of. Before anything is rendered it must pass three SubjectAccessReviews:
                  it can read the SupplyChain (scope), it may declare policy for it
                  (intent), and it may produce the admission policies (output). The
                  controller creates the ServiceAccount; granting it those permissions is
                  left to an administrator.
                type: string
              signers:
                description: |-
                  signers are the keyless identities whose signature and authorization
                  attestation are accepted; any one of them is enough. Each must hold a
                  Fulcio certificate chaining to the trust root.
                  Defaults to the SupplyChain's ServiceAccount, which is the identity the
                  pipeline signs with.
                items:
                  description: PolicySigner is one keyless identity allowed to sign.
                  properties:
                    issuer:
                      description: |-
                        issuer is the OIDC issuer that vouched for the signer.
                        Defaults to the cluster's ServiceAccount token issuer.
                      type: string
                    serviceAccountName:
                      description: |-
                        serviceAccountName names a ServiceAccount in the policy's namespace. It
                        is shorthand for the subject Fulcio issues to that ServiceAccount.
                      minLength: 1
                      type: string
                    subject:
                      description: |-
                        subject is the exact subject of the Fulcio certificate, for signers that
                        are not a ServiceAccount in this namespace.
                      minLength: 1
                      type: string
                  type: object
                  x-kubernetes-validations:
                  - message: set exactly one of serviceAccountName or subject
                    rule: has(self.serviceAccountName) != has(self.subject)
                maxItems: 16
                type: array
                x-kubernetes-list-type: atomic
              supplyChainRef:
                description: supplyChainRef references the SupplyChain whose images
                  this policy admits.
                properties:
                  name:
                    description: Name of the object.
                    type: string
                required:
                - name
                type: object
              trustRoot:
                description: |-
                  trustRoot is the sigstore instance signatures and attestations are
                  verified against: the Fulcio CA that must have issued the signer's
                  certificate, the CT log that must have witnessed it, and the Rekor log
                  the signature must be recorded in. It is rendered as the
                  policy-controller TrustRoot.
                  Each part defaults to the SupplyChain's signing endpoints and to the
                  sigstore trust anchor ConfigMap in the policy's namespace.
                properties:
                  ctLog:
                    description: ctLog is the certificate transparency log. Its PEM
                      is the log's public key.
                    properties:
                      pemRef:
                        description: |-
                          pemRef points at the PEM that identifies the service.
                          Defaults to the matching key of the sigstore trust anchor ConfigMap.
                        properties:
                          key:
                            description: key within the ConfigMap.
                            minLength: 1
                            type: string
                          name:
                            description: name of the ConfigMap.
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      url:
                        description: |-
                          url is the service endpoint.
                          Defaults to the matching endpoint in the SupplyChain's signing spec.
                        pattern: ^https?://
                        type: string
                    type: object
                  fulcio:
                    description: fulcio is the certificate authority. Its PEM is the
                      CA certificate chain.
                    properties:
                      pemRef:
                        description: |-
                          pemRef points at the PEM that identifies the service.
                          Defaults to the matching key of the sigstore trust anchor ConfigMap.
                        properties:
                          key:
                            description: key within the ConfigMap.
                            minLength: 1
                            type: string
                          name:
                            description: name of the ConfigMap.
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      url:
                        description: |-
                          url is the service endpoint.
                          Defaults to the matching endpoint in the SupplyChain's signing spec.
                        pattern: ^https?://
                        type: string
                    type: object
                  rekor:
                    description: rekor is the signature transparency log. Its PEM
                      is the log's public key.
                    properties:
                      pemRef:
                        description: |-
                          pemRef points at the PEM that identifies the service.
                          Defaults to the matching key of the sigstore trust anchor ConfigMap.
                        properties:
                          key:
                            description: key within the ConfigMap.
                            minLength: 1
                            type: string
                          name:
                            description: name of the ConfigMap.
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      url:
                        description: |-
                          url is the service endpoint.
                          Defaults to the matching endpoint in the SupplyChain's signing spec.
                        pattern: ^https?://
                        type: string
                    type: object
                type: object
            required:
            - supplyChainRef
            type: object
          status:
            description: status defines the observed state of SupplyChainPolicy
            properties:
              authorization:
                description: |-
                  authorization is the outcome of the three SubjectAccessReviews for the
                  policy's ServiceAccount, as of the last reconcile.
                properties:
                  intent:
                    description: 'intent: the ServiceAccount may declare admission
                      policy for it.'
                    properties:
                      allowed:
                        description: allowed is the API server's verdict.
                        type: boolean
                      evaluatedAt:
                        description: evaluatedAt is when the review was performed.
                        format: date-time
                        type: string
                      group:
                        description: group is the API group of the resource.
                        type: string
                      principal:
                        description: principal is the identity that was reviewed.
                        type: string
                      reason:
                        description: reason is the API server's explanation, if it
                          gave one.
                        type: string
                      resource:
                        description: resource is the resource the action targets.
                        type: string
                      verb:
                        description: verb is the action.
                        type: string
                    required:
                    - allowed
                    - evaluatedAt
                    - principal
                    - resource
                    - verb
                    type: object
                  output:
                    description: 'output: the ServiceAccount may produce the admission
                      policies.'
                    properties:
                      allowed:
                        description: allowed is the API server's verdict.
                        type: boolean
                      evaluatedAt:
                        description: evaluatedAt is when the review was performed.
                        format: date-time
                        type: string
                      group:
                        description: group is the API group of the resource.
                        type: string
                      principal:
                        description: principal is the identity that was reviewed.
                        type: string
                      reason:
                        description: reason is the API server's explanation, if it
                          gave one.
                        type: string
                      resource:
                        description: resource is the resource the action targets.
                        type: string
                      verb:
                        description: verb is the action.
                        type: string
                    required:
                    - allowed
                    - evaluatedAt
                    - principal
                    - resource
                    - verb
                    type: object
                  scope:
                    description: 'scope: the ServiceAccount can read the SupplyChain
                      it sets policy for.'
                    properties:
                      allowed:
                        description: allowed is the API server's verdict.
                        type: boolean
                      evaluatedAt:
                        description: evaluatedAt is when the review was performed.
                        format: date-time
                        type: string
                      group:
                        description: group is the API group of the resource.
                        type: string
                      principal:
                        description: principal is the identity that was reviewed.
                        type: string
                      reason:
                        description: reason is the API server's explanation, if it
                          gave one.
                        type: string
                      resource:
                        description: resource is the resource the action targets.
                        type: string
                      verb:
                        description: verb is the action.
                        type: string
                    required:
                    - allowed
                    - evaluatedAt
                    - principal
                    - resource
                    - verb
                    type: object
                type: object
              clusterImagePolicies:
                description: |-
                  clusterImagePolicies are the names of the managed policy.sigstore.dev
                  ClusterImagePolicies. An image must satisfy all of them: one requires the
                  keyless signature, the other the authorization attestation.
                items:
                  type: string
                type: array
              conditions:
                description: |-
                  conditions represent the current state of the SupplyChainPolicy resource.

                  Condition types:
                  - "Ready": the TrustRoot and ClusterImagePolicies are in sync with the SupplyChain

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              ctLogURL:
                description: |-
                  ctLogURL is the certificate transparency log the signers' certificates
                  must carry a proof from.
                type: string
              fulcioURL:
                description: |-
                  fulcioURL is the certificate authority the signers' certificates must
                  chain to.
                type: string
              images:
                description: images are the image globs the ClusterImagePolicies apply
                  to.
                items:
                  type: string
                type: array
              observedGeneration:
                description: observedGeneration is the generation last reconciled.
                format: int64
                type: integer
              rekorURL:
                description: |-
                  rekorURL is the transparency log signatures and attestations must be
                  recorded in.
                type: string
              signers:
                description: |-
                  signers are the identities the policy accepts, as resolved from the spec
                  and the SupplyChain.
                items:
                  description: SignerIdentity is a signer as it appears in a Fulcio
                    certificate.
                  properties:
                    issuer:
                      description: issuer is the OIDC issuer in the certificate.
                      type: string
                    subject:
                      description: subject is the subject in the certificate.
                      type: string
                  required:
                  - issuer
                  - subject
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              trustAnchors:
                description: |-
                  trustAnchors are the fingerprints of the key material in the rendered
                  TrustRoot.
                properties:
                  ctLogKey:
                    description: ctLogKey is the SHA-256 of the CT log public key.
                    type: string
                  fulcioRoot:
                    description: fulcioRoot is the SHA-256 of the Fulcio root certificate.
                    type: string
                  rekorKey:
                    description: rekorKey is the SHA-256 of the Rekor public key.
                    type: string
                type: object
              trustRoot:
                description: trustRoot is the name of the managed policy.sigstore.dev
                  TrustRoot.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
