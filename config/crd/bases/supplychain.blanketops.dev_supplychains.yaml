      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SupplyChain is the Schema for the supplychains API.
          One SupplyChain per repository — this is law.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of SupplyChain
            properties:
              image:
                description: Image defines how the container image is built and where
                  it's pushed
                properties:
                  builderImage:
                    default: paketobuildpacks/builder-jammy-base
                    description: BuilderImage is the Cloud Native Buildpacks builder
                      image
                    type: string
                  cloneSecret:
                    description: CloneSecretRef references a Secret with git ssh credentials
                    type: string
                  name:
                    description: Name is the image name (without tag)
                    type: string
                  registry:
                    description: Registry is the image registry to push to (e.g. ttl.sh,
                      ghcr.io)
                    type: string
                  registrySecret:
                    description: PushSecretRef references a Secret with registry credentials
                    type: string
                  tagStrategy:
                    default: git-sha
                    description: Tag strategy for the built image
                    enum:
                    - git-sha
                    - semver
                    - latest
