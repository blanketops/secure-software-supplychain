                    type: string
                  oidcIssuer:
                    default: https://oauth2.sigstore.dev/auth
                    description: OIDCIssuer is the OIDC issuer for keyless signing
                    type: string
                  rekorURL:
                    default: https://rekor.sigstore.dev
                    description: RekorURL is the Rekor transparency log endpoint
                    type: string
                type: object
              steps:
                description: Steps defines which pipeline steps are enabled and their
                  configuration
                properties:
                  attest:
                    default: true
                    description: Attest enables provenance attestation via Tekton
