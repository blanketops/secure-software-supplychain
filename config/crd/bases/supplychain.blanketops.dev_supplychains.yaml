                - name
                - registry
                type: object
              repository:
                description: |-
                  INSERT ADDITIONAL SPEC FIELDS - desired state of cluster
                  Important: Run "make" to regenerate code after modifying this file
                  The following markers will use OpenAPI v3 schema to validate the value
                  More info: https://book.kubebuilder.io/reference/markers/crd-validation.html
                  Repository is the GitHub repo this supply chain is bound to (owner/name format).
                  One SupplyChain per repository — this is law.
                type: string
              serviceAccountName:
                default: default
                description: ServiceAccountName is the k8s SA used by Tekton TaskRuns
                type: string
              signing:
                description: Signing defines Sigstore signing configuration
