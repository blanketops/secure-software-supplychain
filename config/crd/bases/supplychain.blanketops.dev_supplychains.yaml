                    type: boolean
                  buildpacks:
                    default: true
                    description: Buildpacks enables the Cloud Native Buildpacks build
                      step
                    type: boolean
                  sign:
                    default: true
                    description: Sign enables image signing via Cosign + Sigstore
                    type: boolean
                  sonarQube:
                    description: SonarQube enables static analysis via SonarQube
