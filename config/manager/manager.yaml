apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: secure-software-supply-chain
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: secure-software-supply-chain
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: secure-software-supply-chain
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: secure-software-supply-chain
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image for them with `PLATFORMS=... mage ko:push`.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      # No command: the image is built with ko, which sets the entrypoint to
      # the manager binary.
      - args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        image: controller:latest
        imagePullPolicy: Never
        name: manager
        ports: []
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        # immudb, where each build's evidence is stored: IMMUDB_ADDR, _PORT,
        # _USER, _PASSWORD and _DB come from the Secret "immudb". Without it
        # the controller cannot store evidence, and every finished build says
        # so in its ImageBuildResult (status.evidence.ledgerMessage).
        envFrom:
        - secretRef:
            name: immudb
            optional: true
        env:
        - name: IMMUDB_STATE_DIR
          value: /var/lib/immudb-client
        volumeMounts:
        - name: immudb-client-state
          mountPath: /var/lib/immudb-client
      volumes:
      # The immudb client's verified state: what it has proven about the
      # database so far. It starts over when the pod is replaced.
      - name: immudb-client-state
        emptyDir: {}
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
