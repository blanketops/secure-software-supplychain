# This rule is not used by the project secure-software-supply-chain itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to supplychain.blanketops.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: secure-software-supply-chain
    app.kubernetes.io/managed-by: kustomize
  name: imagebuild-viewer-role
rules:
- apiGroups:
  - supplychain.blanketops.dev
  resources:
  - imagebuilds
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - supplychain.blanketops.dev
  resources:
  - imagebuilds/status
  verbs:
  - get
