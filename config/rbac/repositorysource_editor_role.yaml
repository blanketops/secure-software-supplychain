# This rule is not used by the project blanketops-environments-supply-chain itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the supplychain.blanketops.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: blanketops-environments-supply-chain
    app.kubernetes.io/managed-by: kustomize
  name: repositorysource-editor-role
rules:
- apiGroups:
  - supplychain.blanketops.dev
  resources:
  - repositorysources
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - supplychain.blanketops.dev
  resources:
  - repositorysources/status
  verbs:
  - get
