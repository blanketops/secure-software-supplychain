---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - supplychain.blanketops.dev
  resources:
  - githubwebhooks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - supplychain.blanketops.dev
  resources:
  - githubwebhooks/finalizers
  verbs:
  - update
- apiGroups:
  - supplychain.blanketops.dev
  resources:
  - githubwebhooks/status
  verbs:
  - get
  - patch
  - update
