# This rule is not used by the project secure-software-supply-chain itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over supplychain.blanketops.dev.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: secure-software-supply-chain
    app.kubernetes.io/managed-by: kustomize
  name: supplychainpolicy-admin-role
rules:
- apiGroups:
  - supplychain.blanketops.dev
  resources:
  - supplychainpolicies
  verbs:
  - '*'
- apiGroups:
  - supplychain.blanketops.dev
  resources:
  - supplychainpolicies/status
  verbs:
  - get
