# The same store, backed by AWS Secrets Manager instead of Vault: an example
# of using a provider of your own. Install with
# `supplychain install --external-secret-store` so that no Vault is set up,
# and apply a store like this one. It has not been run as part of this
# project's tests; treat it as a starting point.
#
# Whatever the provider, the store has to answer to the same names, because
# the operator creates the ExternalSecrets that read from it:
#
#   the store's name     secure-software-supply-chain-store
#
#   secret (key)             field (property)   what it is
#   supplychain/git          ssh-privatekey     SSH key that can read the repository
#                            known-hosts        the git host's keys (ssh-keyscan github.com)
#                            ssh-config         SSH client configuration for the git host
#   supplychain/registry     config             Docker config.json with push access
#   supplychain/github       token              token that can manage the repository's webhooks
#   supplychain/sonarqube    token              from `supplychain init-sonarqube --token-file`
#
# In Secrets Manager each of the four is one secret named by its key, whose
# value is a JSON object with those fields, for example for supplychain/github:
#
#   {"token": "<github token>"}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: secure-software-supply-chain-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: <aws-region>
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-secrets-manager-auth-secret
            namespace: external-secrets
            key: access-key
          secretAccessKeySecretRef:
            name: aws-secrets-manager-auth-secret
            namespace: external-secrets
            key: secret-access-key
