# The store every build's credentials are read through, backed by Vault.
#
# `supplychain install` creates exactly this, pointed at the Vault it runs,
# when the signing identity is Kubernetes. With `--signing-identity spiffe`
# the login is a SPIFFE identity instead; see
# externalsecrets_v1_clustersecretstore_vault_spiffe.yaml.
# With `--vault-addr` it creates the same store for a Vault you already have,
# at that address and logging in with JWT auth instead; see
# docs/installation.md. You only need this file to set a store up by hand.
#
# The operator creates the ExternalSecrets that read from this store, and puts
# them back if they are changed. What they ask for is therefore fixed:
#
#   the store's name     secure-software-supply-chain-store
#
#   key                              what it is
#   supplychain/git/ssh-privatekey   SSH key that can read the repository
#   supplychain/git/known-hosts      the git host's keys (ssh-keyscan github.com)
#   supplychain/git/ssh-config       SSH client configuration for the git host
#   supplychain/registry/config      Docker config.json with push access
#   supplychain/github/token         token that can manage the repository's webhooks
#   supplychain/sonarqube/token      written by `supplychain init-sonarqube`
#   supplychain/immudb/password      written by `supplychain install immudb`
#
# In Vault each key is one secret under the key-value (version 2) engine named
# in `path`, holding a single field named "value":
#
#   supplychain secrets set git/ssh-privatekey=@<file> git/known-hosts=@<file>
#   supplychain secrets get git/known-hosts
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: secure-software-supply-chain-store
spec:
  provider:
    vault:
      server: https://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      # Vault's certificate comes from the secure software supply chain's CA.
      caProvider:
        type: ConfigMap
        name: supply-chain-ca
        key: ca.crt
        namespace: vault
      auth:
        # External Secrets logs in as this ServiceAccount; the store itself
        # holds no token. Vault's role "supply-chain" is bound to it and gives
        # a policy that can read secret/supplychain/* and nothing else.
        kubernetes:
          mountPath: kubernetes
          role: supply-chain
          serviceAccountRef:
            name: supply-chain-secrets
            namespace: vault
