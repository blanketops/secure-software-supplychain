# The store every build's credentials are read through, backed by Vault.
#
# `supplychain install` creates exactly this, pointed at the Vault it runs, so
# you only need this file for a Vault of your own: change `server`, and give
# that Vault the role and policy described in docs/installation.md.
#
# The operator creates the ExternalSecrets that read from this store, and puts
# them back if they are changed. What they ask for is therefore fixed:
#
#   the store's name     secure-software-supply-chain-store
#
#   secret (key)             field (property)   what it is
#   supplychain/git          ssh-privatekey     SSH key that can read the repository
#                            known-hosts        the git host's keys (ssh-keyscan github.com)
#                            ssh-config         SSH client configuration for the git host
#   supplychain/registry     config             Docker config.json with push access
#   supplychain/github       token              token that can manage the repository's webhooks
#   supplychain/sonarqube    token              written by `supplychain init-sonarqube`
#
# In Vault these are four secrets under the key-value (version 2) engine named
# in `path`, each with those fields:
#
#   supplychain secrets set git ssh-privatekey=@<file> known-hosts=@<file> ssh-config=@<file>
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: secure-software-supply-chain-store
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        # External Secrets logs in as this ServiceAccount; the store itself
        # holds no token. Vault's role "supply-chain" is bound to it and gives
        # a policy that can read secret/supplychain/* and nothing else.
        kubernetes:
          mountPath: kubernetes
          role: supply-chain
          serviceAccountRef:
            name: supply-chain-secrets
            namespace: vault
