# The store every build's credentials are read through, backed by Vault, when
# the stack is installed with `--signing-identity spiffe`.
#
# `supplychain install` creates exactly this. External Secrets logs in to Vault
# with a SPIFFE JWT-SVID, as in https://spiffe.io/docs/latest/keyless/vault/readme/:
# Vault's role accepts one identity,
#
#   spiffe://<your-domain>/ns/vault/sa/supply-chain-secrets
#
# and the Deployment vault/supply-chain-svid keeps that identity's current
# JWT-SVID, valid for ten minutes, in the Secret named below. See
# docs/installation.md. You only need this file to set a store up by hand.
#
# The keys the store answers to are the same as in
# externalsecrets_v1_clustersecretstore_vault.yaml:
#
#   supplychain/git/ssh-privatekey   supplychain/registry/config
#   supplychain/git/known-hosts      supplychain/github/token
#   supplychain/git/ssh-config       supplychain/sonarqube/token
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: secure-software-supply-chain-store
spec:
  provider:
    vault:
      server: https://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      # Vault's certificate comes from the secure software supply chain's CA.
      caProvider:
        type: ConfigMap
        name: supply-chain-ca
        key: ca.crt
        namespace: vault
      auth:
        jwt:
          path: jwt
          role: supply-chain
          secretRef:
            name: supply-chain-vault-jwt
            namespace: vault
            key: jwt
