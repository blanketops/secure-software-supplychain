apiVersion: supplychain.blanketops.dev/v1alpha1
kind: GitHubWebhook
metadata:
  labels:
    app.kubernetes.io/name: secure-software-supply-chain
    app.kubernetes.io/managed-by: kustomize
  name: your-app-webhook
  namespace: default
spec:
  # Repository to register the webhook on — owner/repo format.
  repository: your-org/your-app
  # SupplyChain that owns the EventListener this webhook targets.
  # Controller waits for the SupplyChain to be Ready before registering.
  supplyChainRef:
    name: your-app
  # URL where GitHub delivers webhook payloads.
  # Local kind dev: use a smee.io channel URL.
  # Production: use the EventListener ingress URL.
  hookURL: https://your-machine.your-tailnet.ts.net

  # GitHub event types to subscribe to.
  events:
  - push
  # Webhook payload format.
  contentType: json

  # Set to true only for local dev with self-signed certs.
  insecureSSL: false

  # Secret containing the GitHub API token (key: "token").
  # Must have admin:repo_hook and repo permissions.
  secretRef:
    name: github-app-credentials
  # Optional: shared secret for GitHub payload signature verification (key: "secret").
  # webhookSecretRef:
  #   name: github-webhook-secret
