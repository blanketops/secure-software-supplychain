apiVersion: supplychain.blanketops.dev/v1alpha1
kind: SupplyChainPolicy
metadata:
  labels:
    app.kubernetes.io/name: secure-software-supply-chain
    app.kubernetes.io/managed-by: kustomize
  name: for-kaniko-app
spec:
  # The SupplyChain whose image this policy admits. The image repository, the
  # Fulcio and CT log endpoints and the trust anchors come from it and from the
  # blanketops-sigstore-roots ConfigMap.
  supplyChainRef:
    name: for-kaniko-app

  # The ServiceAccount the policy is rendered on behalf of. Nothing is rendered
  # until it passes three SubjectAccessReviews: scope (get supplychains),
  # intent (create supplychainpolicies) and output (create
  # clusterimagepolicies). Grant them with supplychain_v1alpha1_policyrole.yaml.
  serviceAccountName: supply-chain-policy-runner

  # enforce rejects an image that fails verification; warn admits it with a
  # warning.
  mode: enforce

  # Who may sign. An image is admitted only if one of these identities signed
  # it keylessly (Fulcio certificate with a CT log proof) and attested the
  # three authorization proofs (scope, intent, output).
  # Optional: defaults to the SupplyChain's ServiceAccount.
  signers:
  - serviceAccountName: supply-chain-runner
    issuer: https://kubernetes.default.svc.cluster.local
  # A signer outside this namespace is stated by its certificate subject:
  # - subject: https://kubernetes.io/namespaces/release/serviceaccounts/release-signer
  #   issuer: https://kubernetes.default.svc.cluster.local

  # The transparency log every signature and attestation must be recorded in.
  # Optional: defaults to the SupplyChain's signing.rekorURL.
  rekor:
    url: http://rekor-server.rekor-system.svc.cluster.local
