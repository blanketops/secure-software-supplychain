# The private certificate authority every service of the secure software supply chain gets its
# TLS certificate from: Rekor, Fulcio, the CT log, Vault and SPIRE's OIDC
# discovery. cert-manager issues and renews the certificates; clients trust
# this one CA, which the installer copies to where they read it.
#
# The CA is made here, once, and signs itself. Its key stays in the
# supply-chain-ca Secret in the cert-manager namespace. To use a CA of your
# own instead, put its certificate and key in that Secret before installing.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: supply-chain-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: supply-chain-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: Secure Software Supply Chain CA
  secretName: supply-chain-ca
  # Ten years, renewed a year before it ends. Replacing it replaces what every
  # client trusts, so it is long-lived and the certificates under it are not.
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    name: supply-chain-selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: supply-chain-ca
spec:
  ca:
    secretName: supply-chain-ca
