apiVersion: v1
kind: ConfigMap
metadata:
  name: fulcio-config
  namespace: fulcio-system
  labels:
    blanketops.dev/managed: "true"
    blanketops.dev/component: "sigstore"
  annotations:
    blanketops.dev/description: "Fulcio OIDC config patched for in-cluster Kubernetes issuer"
data:
  config.json: |
    {
      "OIDCIssuers": {
        "https://kubernetes.default.svc.cluster.local": {
          "IssuerURL": "https://kubernetes.default.svc.cluster.local",
          "ClientID": "sigstore",
          "Type": "kubernetes"
        }
      }
    }
