# immudb, the ledger the operator writes each build's evidence to. One
# replica on purpose: immudb is one tamper-evident history, and a second pod
# would be a second, separate ledger. Its data is on its own volume.
#
# The admin password is generated by `supplychain install immudb` into Vault
# (supplychain/immudb/password); the ExternalSecret below brings it into this
# namespace, and the operator's own ExternalSecret into the operator's.
apiVersion: v1
kind: Namespace
metadata:
  name: immudb-system
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immudb-admin
  namespace: immudb-system
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: secure-software-supply-chain-store
    kind: ClusterSecretStore
  target:
    name: immudb-admin
    template:
      type: Opaque
  data:
  - secretKey: IMMUDB_ADMIN_PASSWORD
    remoteRef:
      key: supplychain/immudb/password
      property: value
---
apiVersion: v1
kind: Service
metadata:
  name: immudb
  namespace: immudb-system
  labels:
    app.kubernetes.io/name: immudb
spec:
  selector:
    app.kubernetes.io/name: immudb
  ports:
  - name: grpc
    port: 3322
    targetPort: grpc
  # The web console and REST API. The NetworkPolicy admits no pod to it; reach
  # it with kubectl port-forward.
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: immudb
  namespace: immudb-system
  labels:
    app.kubernetes.io/name: immudb
spec:
  replicas: 1
  serviceName: immudb
  selector:
    matchLabels:
      app.kubernetes.io/name: immudb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immudb
    spec:
      automountServiceAccountToken: false
      # The Service immudb would otherwise make Kubernetes inject
      # IMMUDB_PORT=tcp://<service>:3322, which immudb reads as its own port
      # setting and then listens on port 0.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 3322
        runAsGroup: 3322
        fsGroup: 3322
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: immudb
        image: docker.io/codenotary/immudb:1.11.0@sha256:f2efcf6a3de73b31691e0afb8dfec972642aaf0699b93387d1ec6074aedb2953
        imagePullPolicy: IfNotPresent
        env:
        - name: IMMUDB_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: immudb-admin
              key: IMMUDB_ADMIN_PASSWORD
        # The admin user still logs in over the network with dev mode off.
        - name: IMMUDB_DEVMODE
          value: "false"
        - name: IMMUDB_PGSQL_SERVER
          value: "false"
        ports:
        - name: grpc
          containerPort: 3322
        - name: http
          containerPort: 8080
        - name: metrics
          containerPort: 9497
        readinessProbe:
          tcpSocket:
            port: grpc
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: grpc
          initialDelaySeconds: 30
          periodSeconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/immudb
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi
---
# Only the operator may connect, and only to the gRPC port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: immudb
  namespace: immudb-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: immudb
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: secure-software-supply-chain-system
    ports:
    - protocol: TCP
      port: 3322
