# Allow anonymous access to the OIDC discovery endpoint.
# Required for Fulcio to verify in-cluster Kubernetes OIDC tokens.
# Without this, Fulcio gets 403 Forbidden when fetching:
#   https://kubernetes.default.svc.cluster.local/.well-known/openid-configuration
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-discovery-public
  labels:
    blanketops.dev/managed: "true"
    blanketops.dev/component: "sigstore"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery
subjects:
- kind: Group
  apiGroup: rbac.authorization.k8s.io
  name: system:unauthenticated
