# Source: fulcio/templates/fulcio-deployment.yaml
# BlanketOps patches applied:
#   1. SSL_CERT_FILE env var — tells Go TLS to trust the kube root CA when
#      Fulcio fetches https://kubernetes.default.svc.cluster.local/.well-known/openid-configuration
#   2. oidc-info volume — mounts kube-root-ca.crt at /var/run/fulcio/ca.crt
#   3. mode: 438 — octal 0666, required by Kubernetes projected volume validation
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fulcio-server
  namespace: fulcio-system
  labels:
    helm.sh/chart: fulcio-2.7.5
    app.kubernetes.io/name: fulcio
    app.kubernetes.io/instance: fulcio
    app.kubernetes.io/version: "1.8.5"
    app.kubernetes.io/managed-by: Helm
    blanketops.dev/managed: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fulcio
      app.kubernetes.io/instance: fulcio
  template:
    metadata:
      annotations:
        checksum/config: 7978b3e13ce508c72b48574713cca9ce430acca88503b89f7e0a515e8966b8a1
      labels:
        app.kubernetes.io/name: fulcio
        app.kubernetes.io/instance: fulcio
    spec:
      serviceAccountName: fulcio-server
      automountServiceAccountToken: true
      containers:
      - name: fulcio-server
        image: "ghcr.io/sigstore/fulcio:v1.8.5@sha256:b51ed0cb6761070d632bf81d28894ef1827b2c18da2535689ca8e98d91d3a015"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5555
          protocol: TCP
        - containerPort: 5554
          protocol: TCP
        - containerPort: 2112
          protocol: TCP
        args:
        - "serve"
        # Loopback only, HTTP and gRPC both: the "tls" container in this pod
        # is the way in.
        - "--host=127.0.0.1"
        - "--port=5555"
        - "--grpc-host=127.0.0.1"
        - "--grpc-port=5554"
        - "--ca=fileca"
        - "--fileca-key"
        - "/var/run/fulcio-secrets/key.pem"
        - "--fileca-cert"
        - "/var/run/fulcio-secrets/cert.pem"
        - "--fileca-key-passwd"
        - "$(PASSWORD)"
        - "--ct-log-url=https://ctlog.ctlog-system.svc/fulcio"
        - "--ct-log.tls-ca-cert=/etc/supply-chain-ca/ca.crt"
        - "--config-path=/etc/fulcio-config/config.json"
        env:
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: fulcio-server-secret
              key: password
        # SSL_CERT_FILE tells Go's TLS stack to trust the kube root CA.
        # Required so Fulcio can verify the OIDC discovery endpoint at
        # https://kubernetes.default.svc.cluster.local/.well-known/openid-configuration
        - name: SSL_CERT_FILE
          value: /var/run/fulcio/ca.crt
        # And the secure software supply chain's CA, for SPIRE's OIDC discovery when workloads
        # sign with SPIFFE identities.
        - name: SSL_CERT_DIR
          value: /etc/supply-chain-ca
        volumeMounts:
        - name: fulcio-config
          mountPath: /etc/fulcio-config
        - name: oidc-info
          mountPath: /var/run/fulcio
        - name: fulcio-cert
          mountPath: "/var/run/fulcio-secrets"
          readOnly: true
        - name: tls-ca
          mountPath: /etc/supply-chain-ca
          readOnly: true
      - name: tls
        image: docker.io/nginxinc/nginx-unprivileged:1.30.0-alpine
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "/etc/nginx/conf.d/run.sh"]
        ports:
        - name: https
          containerPort: 8443
          protocol: TCP
        # The server listens on loopback, which the kubelet cannot probe, so the
        # pod's health is read through this container: /healthz answers only when
        # the server does.
        readinessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
          initialDelaySeconds: 60
          periodSeconds: 20
          failureThreshold: 6
        securityContext:
          runAsUser: 101
          runAsGroup: 101
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        volumeMounts:
        - name: tls
          mountPath: /tls
          readOnly: true
        - name: tls-proxy
          mountPath: /etc/nginx/conf.d
      securityContext:
        runAsNonRoot: true
        runAsUser: 65533
      volumes:
      - name: fulcio-config
        configMap:
          name: fulcio-server-config
      - name: oidc-info
        projected:
          sources:
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
                mode: 438
      - name: fulcio-cert
        secret:
          secretName: fulcio-server-secret
          items:
          - key: private
            path: key.pem
          - key: cert
            path: cert.pem
      - name: tls
        secret:
          secretName: fulcio-server-tls
      - name: tls-proxy
        configMap:
          name: fulcio-server-tls-proxy
      # The CA alone, for verifying the CT log's certificate.
      - name: tls-ca
        secret:
          secretName: fulcio-server-tls
          items:
          - key: ca.crt
            path: ca.crt
