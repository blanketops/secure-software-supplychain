# Source: fulcio/charts/ctlog/templates/createctconfig-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: fulcio-ctlog-createctconfig
  namespace: ctlog-system
  labels:
    helm.sh/chart: ctlog-0.2.66
    app.kubernetes.io/name: ctlog
    app.kubernetes.io/instance: fulcio
    app.kubernetes.io/version: "0.7.31"
    app.kubernetes.io/managed-by: Helm
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 6
  template:
    spec:
      serviceAccountName: fulcio-ctlog-createctconfig
      restartPolicy: Never
      automountServiceAccountToken: true
      initContainers:
      - name: wait-for-createtree-configmap
        image: "docker.io/curlimages/curl:8.17.0@sha256:935d9100e9ba842cdb060de42472c7ca90cfe9a7c96e4dacb55e79e560b3ff40"
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          until curl --fail \
            --header "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
            --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
            --max-time 10 \
            https://kubernetes.default.svc/api/v1/namespaces/$(NAMESPACE)/configmaps/ctlog-config \
            | grep '"treeID":'; do
            echo waiting for Configmap ctlog-config
            sleep 5
          done
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
      containers:
      - name: fulcio-ctlog-createctconfig
        image: "ghcr.io/sigstore/scaffolding/createctconfig:v0.7.31@sha256:3a061734c5be610d69830ea1e223bd6a8b86bc262b67ff7409147d7db698df51"
        imagePullPolicy: IfNotPresent
        args:
        - "--configmap=ctlog-config"
        - "--secret=ctlog-secret"
        - "--pubkeysecret=ctlog-public-key"
        - "--fulcio-url=https://fulcio-server.fulcio-system.svc"
        - "--trillian-server=trillian-logserver.trillian-system:8091"
        - "--log-prefix=fulcio"
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # Fulcio's certificate comes from the secure software supply chain's CA, which is
        # trusted here in addition to the image's public CAs.
        - name: SSL_CERT_DIR
          value: /etc/supply-chain-ca:/etc/ssl/certs
        volumeMounts:
        - name: tls-ca
          mountPath: /etc/supply-chain-ca
          readOnly: true
      volumes:
      - name: tls-ca
        secret:
          secretName: ctlog-tls
          items:
          - key: ca.crt
            path: ca.crt
      securityContext:
        runAsNonRoot: true
        runAsUser: 65533
