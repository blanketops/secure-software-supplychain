# Source: fulcio/charts/ctlog/templates/ctlog-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctlog
  namespace: ctlog-system
  labels:
    helm.sh/chart: ctlog-0.2.66
    app.kubernetes.io/name: ctlog
    app.kubernetes.io/instance: fulcio
    app.kubernetes.io/version: "0.7.31"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ctlog
      app.kubernetes.io/instance: fulcio
  template:
    metadata:
      annotations:
        checksum/config: 3bea4e48292aa8bfded4d20ecb709a1304bed2befd481bbba4c4036f0da3bdd4
        prometheus.io/path: /metrics
        prometheus.io/port: "6963"
        prometheus.io/scrape: "true"
      labels:
        helm.sh/chart: ctlog-0.2.66
        app.kubernetes.io/name: ctlog
        app.kubernetes.io/instance: fulcio
        app.kubernetes.io/version: "0.7.31"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: ctlog
      containers:
      - name: ctlog
        image: "ghcr.io/sigstore/scaffolding/ct_server:v0.7.31@sha256:66664ba563e7c2564ba32fb5d0e8fdeb42d7f0d5ce45f0df5d80074daea5126c"
        imagePullPolicy: IfNotPresent
        args:
        # Loopback only: the "tls" container in this pod is the way in.
        - "--http_endpoint=127.0.0.1:6962"
        - "--metrics_endpoint=0.0.0.0:6963"
        - "--log_config=/ctfe-keys/config"
        - "--alsologtostderr"
        volumeMounts:
        - name: keys
          mountPath: "/ctfe-keys"
          readOnly: true
        ports:
        - containerPort: 6962
          protocol: TCP
        - containerPort: 6963
          protocol: TCP
      - name: tls
        image: docker.io/nginxinc/nginx-unprivileged:1.30.0-alpine
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "/etc/nginx/conf.d/run.sh"]
        ports:
        - name: https
          containerPort: 8443
          protocol: TCP
        # The server listens on loopback, which the kubelet cannot probe, so the
        # pod's health is read through this container: /healthz answers only when
        # the server does.
        readinessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
          initialDelaySeconds: 60
          periodSeconds: 20
          failureThreshold: 6
        securityContext:
          runAsUser: 101
          runAsGroup: 101
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        volumeMounts:
        - name: tls
          mountPath: /tls
          readOnly: true
        - name: tls-proxy
          mountPath: /etc/nginx/conf.d
      securityContext:
        runAsNonRoot: true
        runAsUser: 65533
      volumes:
      - name: keys
        secret:
          secretName: ctlog-secret
      - name: tls
        secret:
          secretName: ctlog-tls
      - name: tls-proxy
        configMap:
          name: ctlog-tls-proxy
