# Source: rekor/templates/server/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: "server"
    app.kubernetes.io/name: rekor
    app.kubernetes.io/instance: rekor
    helm.sh/chart: rekor-1.7.9
    app.kubernetes.io/managed-by: Helm
  name: rekor-server
  namespace: rekor-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: "server"
      app.kubernetes.io/name: rekor
      app.kubernetes.io/instance: rekor
  replicas: 1
  template:
    metadata:
      annotations:
        checksum/config: c8bd79d6cbaf403b8bd007026a17d693e2f2e4decede3067e812707857d6636a
        checksum/sharding_config: 1b4696d9d7f0f7655cad319aaff5e00f10552d5d16ab7cdfa6a188bab625f692
        prometheus.io/path: /metrics
        prometheus.io/port: "2112"
        prometheus.io/scrape: "true"
      labels:
        app.kubernetes.io/component: "server"
        app.kubernetes.io/name: rekor
        app.kubernetes.io/instance: rekor
        helm.sh/chart: rekor-1.7.9
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: rekor-server
      initContainers:
        - name: "wait-for-trillian-log-server"
          image: "docker.io/curlimages/curl@sha256:935d9100e9ba842cdb060de42472c7ca90cfe9a7c96e4dacb55e79e560b3ff40"
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until curl --max-time 10 http://trillian-logserver.trillian-system:8090; do echo waiting for trillian-logserver; sleep 5; done;"]
          resources:
            {}
      containers:
        - name: rekor-server
          image: "ghcr.io/sigstore/rekor/rekor-server:v1.5.1@sha256:63c88133e72b3d2702c383af9c19721477361401e60b605d08c65ac072230a95"
          imagePullPolicy: "IfNotPresent"
          env:
            - name: TREE_ID
              valueFrom:
                configMapKeyRef:
                  name: rekor-config
                  key: treeID
          args:
            - "serve"
            - "--trillian_log_server.address=trillian-logserver.trillian-system"
            - "--trillian_log_server.port=8091"
            - "--trillian_log_server.sharding_config=/sharding/sharding-config.yaml"
            - "--redis_server.address=rekor-redis"
            - "--redis_server.port=6379"
            - "--rekor_server.address=0.0.0.0"
            # Not the chart's "memory": that makes a new signing key every time
            # the pod starts, after which nothing signed before verifies and the
            # stored trust anchor no longer matches. The installer creates the
            # key once, in the rekor-signing-key Secret.
            - "--rekor_server.signer=/var/run/rekor-signer/key.pem"
            - "--enable_retrieve_api=true"
            - "--trillian_log_server.tlog_id=$(TREE_ID)"
            - "--enable_attestation_storage"
            - "--attestation_storage_bucket=file:///var/run/attestations"
          ports:            
            - containerPort: 3000
              protocol: TCP
            - containerPort: 2112
              protocol: TCP
          volumeMounts:
            - name: rekor-sharding-config
              mountPath: /sharding
            - name: storage
              mountPath: /var/run/attestations
            - name: signing-key
              mountPath: /var/run/rekor-signer
              readOnly: true
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /ping
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /ping
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65533
      volumes:
        - name: rekor-sharding-config
