#! Source: sonarqube/templates/sonarqube-sts.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sonarqube-sonarqube
  labels:
    app: sonarqube
    chart: sonarqube-2026.2.1
    release: sonarqube
    heritage: Helm
    app.kubernetes.io/name: sonarqube
    app.kubernetes.io/instance: sonarqube
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: sonarqube
    app.kubernetes.io/component: sonarqube-sonarqube
    app.kubernetes.io/version: "26.3.0.120487-community"
spec:
  replicas: 1
  revisionHistoryLimit: 10
  serviceName: sonarqube-sonarqube
  selector:
    matchLabels:
      app: sonarqube
      release: sonarqube
  template:
    metadata:
      annotations:
        checksum/config: b15c0b8f54554df29e294791562e2fdeed73cd336bdc3da9a5492aedfaacc999
        checksum/init-sysctl: 595595650947679104238f8a225654baa2601151801de3e3772705bccdc4e355
        checksum/plugins: e5cf5847e8e820473c17236e3e7187962f598bc4a5367b633a844f0124419f4e
        checksum/secret: d8cf087b21e60f403911540acc3fe61437f30d369ab735b985e4b78fb54a2350
      labels:
        app: sonarqube
        release: sonarqube
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 0
      initContainers:
      - name: init-sysctl
        image: sonarqube:26.3.0.120487-community
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
          readOnlyRootFilesystem: true
          runAsUser: 0
        command: [ "/bin/bash", "-e", "/tmp/scripts/init_sysctl.sh" ]
        volumeMounts:
        - name: init-sysctl
          mountPath: /tmp/scripts/
        env:
        - name: SONAR_WEB_CONTEXT
          value: /
        - name: SONAR_WEB_JAVAOPTS
          value: ""
        - name: SONAR_CE_JAVAOPTS
          value: ""
      containers:
      - name: sonarqube
        image: sonarqube:26.3.0.120487-community
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 9000
          protocol: TCP
        resources:
          limits:
            cpu: 800m
            ephemeral-storage: 512000M
            memory: 2Gi
          requests:
            cpu: 100m
            ephemeral-storage: 1536M
            memory: 512Mi
        env:
        - name: SONAR_HELM_CHART_VERSION
          value: 2026.2.1
        - name: SONAR_WEB_SYSTEMPASSCODE
          valueFrom:
            secretKeyRef:
              name: sonarqube-sonarqube-monitoring-passcode
              key: SONAR_WEB_SYSTEMPASSCODE
        - name: SONAR_WEB_CONTEXT
          value: /
        - name: SONAR_WEB_JAVAOPTS
          value: ""
        - name: SONAR_CE_JAVAOPTS
          value: ""
        envFrom:
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - |
              curl --noproxy "*" -fsS -o /dev/null --max-time 1 -H "X-Sonar-Passcode: $SONAR_WEB_SYSTEMPASSCODE" "http://localhost:9000/api/system/liveness"
          failureThreshold: 6
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 1
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - |
              #!/bin/bash
              #! A Sonarqube container is considered ready if the status is UP, DB_MIGRATION_NEEDED or DB_MIGRATION_RUNNING
              #! status about migration are added to prevent the node to be kill while SonarQube is upgrading the database.
              if curl --noproxy "*" -s http://localhost:9000/api/system/status | grep -q -e '"status":"UP"' -e '"status":"DB_MIGRATION_NEEDED"' -e '"status":"DB_MIGRATION_RUNNING"'; then
                exit 0
              fi
              exit 1
          failureThreshold: 6
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 1
        startupProbe:
          httpGet:
            scheme: HTTP
            path: /api/system/status
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 24
          timeoutSeconds: 1
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 0
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /opt/sonarqube/data
          name: sonarqube
          subPath: data
        - mountPath: /opt/sonarqube/temp
          name: sonarqube
          subPath: temp
        - mountPath: /opt/sonarqube/logs
          name: sonarqube
          subPath: logs
        - mountPath: /tmp
          name: tmp-dir
        - mountPath: /opt/sonarqube/extensions
          name: sonarqube
          subPath: extensions
      serviceAccountName: default
      volumes:

      - name: init-sysctl
        configMap:
          name: sonarqube-sonarqube-init-sysctl
          items:
          - key: init_sysctl.sh
            path: init_sysctl.sh
      - name: sonarqube
        emptyDir: {}
      - name: tmp-dir
        emptyDir: {}
---
