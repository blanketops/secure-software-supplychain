# SPIRE 1.15.3 (chart spire-0.30.2), rendered with:
#   helm template spire spire --repo https://spiffe.github.io/helm-charts-hardened/ --version 0.30.2 \
#     -n spire-server --no-hooks \
#     --set global.spire.trustDomain=trust-domain.placeholder.invalid \
#     --set global.spire.clusterName=blanketops \
#     --set global.spire.jwtIssuer=http://spire-spiffe-oidc-discovery-provider.spire-server.svc.cluster.local \
#     --set spiffe-oidc-discovery-provider.tls.spire.enabled=false
#
# trust-domain.placeholder.invalid is replaced with --trust-domain at install time.
# Only the ClusterSPIFFEID objects of that render: which pods get which SPIFFE ID.
---
# Source: spire/charts/spire-server/templates/controller-manager-cluster-ids.yaml
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: spire-server-spire-default
  labels:
    spire.spiffe.io/class-name: spire-server-spire
spec:
  className: "spire-server-spire"
  hint: default
  spiffeIDTemplate: "spiffe://{{ .TrustDomain }}/ns/{{ .PodMeta.Namespace }}/sa/{{ .PodSpec.ServiceAccountName }}"
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values:
      - spire-server
      - spire-system
  fallback: true
---
# Source: spire/charts/spire-server/templates/controller-manager-cluster-ids.yaml
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: spire-server-spire-oidc-discovery-provider
  labels:
    spire.spiffe.io/class-name: spire-server-spire
spec:
  className: "spire-server-spire"
  hint: oidc-discovery-provider
  spiffeIDTemplate: "spiffe://{{ .TrustDomain }}/ns/{{ .PodMeta.Namespace }}/sa/{{ .PodSpec.ServiceAccountName }}"
  podSelector:
    matchLabels:
      component: oidc-discovery-provider
      release: spire
      release-namespace: spire-server
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: In
      values:
      - spire-server
      - spire-system
  dnsNameTemplates:
    - oidc-discovery.{{ .TrustDomain }}
  autoPopulateDNSNames: true
---
# Source: spire/charts/spire-server/templates/controller-manager-cluster-ids.yaml
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: spire-server-spire-test-keys
  labels:
    spire.spiffe.io/class-name: spire-server-spire
spec:
  className: "spire-server-spire"
  hint: test-keys
  spiffeIDTemplate: "spiffe://{{ .TrustDomain }}/ns/{{ .PodMeta.Namespace }}/sa/{{ .PodSpec.ServiceAccountName }}"
  podSelector:
    matchLabels:
      component: test-keys
      release: spire
      release-namespace: spire-server
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: In
      values:
      - spire-server
      - spire-system
---
# Not from the chart. Every node of this cluster, as one name, so that an
# identity can be registered before the pod that will use it exists. The
# operator registers each SupplyChain's build ServiceAccount under it; the
# per-pod identities above only appear a few seconds after a pod starts, which
# is too late for a build step that signs straight away.
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterStaticEntry
metadata:
  name: supply-chain-nodes
spec:
  className: "spire-server-spire"
  spiffeID: "spiffe://trust-domain.placeholder.invalid/supply-chain/nodes"
  parentID: "spiffe://trust-domain.placeholder.invalid/spire/server"
  selectors:
    - "k8s_psat:cluster:blanketops"
