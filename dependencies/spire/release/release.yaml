# Source: spire/charts/spiffe-oidc-discovery-provider/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-spiffe-oidc-discovery-provider
  namespace: spire-server
data:
  oidc-discovery-provider.conf: |
    {
      "allow_insecure_scheme": true,
      "domains": [
        "spire-spiffe-oidc-discovery-provider",
        "spire-spiffe-oidc-discovery-provider.spire-server",
        "spire-spiffe-oidc-discovery-provider.spire-server.svc.cluster.local",
        "spire-spiffe-oidc-discovery-provider.spire-server.svc.cluster.local"
      ],
      "health_checks": {
        "bind_port": "8008",
        "live_path": "/live",
        "ready_path": "/ready"
      },
      "jwt_issuer": "http://spire-spiffe-oidc-discovery-provider.spire-server.svc.cluster.local",
      "listen_socket_path": "/run/spire/oidc-sockets/spire-oidc-server.sock",
      "log_format": "text",
      "log_level": "info",
      "workload_api": {
        "socket_path": "/spiffe-workload-api/spire-agent.sock",
        "trust_domain": "trust-domain.placeholder.invalid"
      }
    }
  default.conf: |
    upstream oidc {
      server unix:/run/spire/oidc-sockets/spire-oidc-server.sock;
    }

    server {
      listen            8080;
      listen       [::]:8080;

      location / {
        proxy_pass http://oidc;
        proxy_set_header Host $host;
      }

      location /stub_status {
        allow 127.0.0.1/32;
        deny  all;
        stub_status on;
      }
    }
  spiffe-helper.conf: |
    agent_address = "/spiffe-workload-api/spire-agent.sock"
    cert_dir = "/certs"
    svid_file_name = "tls.crt"
    svid_key_file_name = "tls.key"
    svid_bundle_file_name = "ca.pem"
