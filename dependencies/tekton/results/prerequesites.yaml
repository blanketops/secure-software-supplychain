# Tekton Results prerequisites for local/dev clusters.
# Creates the Postgres credentials secret and a self-signed TLS secret
# that Results expects before the release manifest can be applied.
#
# For production, replace these with proper cert-manager certs and
# a managed Postgres instance.
---
apiVersion: v1
kind: Namespace
metadata:
  name: tekton-pipelines
---
# Postgres credentials — Results looks for this secret by default.
apiVersion: v1
kind: Secret
metadata:
  name: tekton-results-postgres
  namespace: tekton-pipelines
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "secure-software-supplychainresults-dev"
---


