apiVersion: tekton.dev/v1
kind: Task
metadata:
  annotations:
    tekton.dev/categories: Image Build
    tekton.dev/displayName: Build and push container image using Buildah
    tekton.dev/pipelines.minVersion: 0.17.0
    tekton.dev/platforms: linux/amd64
    tekton.dev/tags: image-build
  labels:
    app.kubernetes.io/version: '0.1'
  name: buildah
spec:
  description: Builds a container image from a Dockerfile using Buildah and pushes it to a registry. The image is saved to an archive in the workspace; a later step scans and pushes it.
  params:
  - description: Name (reference) of the image to build and push.
    name: IMAGE
    type: string
  - default: ./Dockerfile
    description: Path to the Dockerfile to build.
    name: DOCKERFILE
    type: string
  - default: .
    description: The build context directory.
    name: CONTEXT
    type: string
  - default: 'true'
    description: Verify TLS on the registry endpoint.
    name: TLSVERIFY
    type: string
  - default: quay.io/buildah/stable:v1.35.0
    description: Buildah image to use.
    name: BUILDER_IMAGE
    type: string
  results:
  # Deliberately not IMAGE_URL / IMAGE_DIGEST: that pair tells Tekton Chains
  # "this TaskRun produced this image". Nothing is published here, and the
  # archive's digest is not the digest the registry will serve after the push.
  - description: Digest of the local image archive. Not a registry digest.
    name: ARCHIVE_DIGEST
    type: string
  steps:
  - name: build
    image: $(params.BUILDER_IMAGE)
    workingDir: $(workspaces.source.path)
    env:
    - name: DOCKER_CONFIG
      value: $(workspaces.dockerconfig.path)
    script: |
      #!/usr/bin/env bash
      set -e
      mkdir -p /etc/containers
      echo 'unqualified-search-registries = ["docker.io"]' > /etc/containers/registries.conf

      buildah --storage-driver=vfs bud \
        --file=$(params.DOCKERFILE) \
        --tag=$(params.IMAGE) \
        $(params.CONTEXT)

      # Save to docker-archive tar — no push yet.
      # Only clean images (passing all chain checks) will be pushed by a later step.
      # --digestfile writes the manifest digest of the tar, not the base image digest.
      buildah --storage-driver=vfs push \
        --digestfile "$(results.ARCHIVE_DIGEST.path)" \
        $(params.IMAGE) \
        docker-archive:$(workspaces.source.path)/image.tar:$(params.IMAGE)

    securityContext:
      capabilities:
        add:
        - SETFCAP
  workspaces:
  - description: Holds the source and Dockerfile.
    name: source
  - description: Docker config.json for registry authentication.
    name: dockerconfig
    optional: true
