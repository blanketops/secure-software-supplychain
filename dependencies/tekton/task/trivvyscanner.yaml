apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: trivy-scanner
  namespace: default
  labels:
    app.kubernetes.io/version: "0.2"
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/categories: Security
    tekton.dev/tags: CLI, trivy
    tekton.dev/displayName: "trivy scanner"
    tekton.dev/platforms: "linux/amd64,linux/arm64,linux/ppc64le,linux/390x"
spec:
  description: >-
    Trivy scanner with SARIF output and rich result extraction. Scans container images for vulnerabilities and emits structured results and a SARIF report for downstream consumption. Supports a persistent cache workspace to avoid re-downloading the Trivy DB (91MB) on every run.
  workspaces:
  - name: manifest-dir
    description: Workspace for source and SARIF report output.
  - name: cache
    description: |
      Persistent cache for the Trivy vulnerability database.
      Mount a PVC here to avoid downloading 91MB on every run.
      If not bound, Trivy uses its default cache location.
    optional: true
  params:
  - name: TRIVY_IMAGE
    default: docker.io/aquasec/trivy@sha256:944a044451791617cc0ed2ee4d1942a4f66b790d527fcd0575a6b399ccbc05a1
    description: Trivy scanner image to be used.
    type: string
  - name: IMAGE_PATH
    description: Image or path to be scanned by trivy.
    type: string
  - name: SEVERITY
    default: "HIGH,CRITICAL"
    description: Severities to scan for.
    type: string
  - name: AIR_GAPPED_ENABLED
    default: "false"
    description: Enable air-gapped mode (pre-download DB, skip update).
    type: string
  results:
  - name: TRIVY_SCAN_SUMMARY
    description: PASS if no HIGH/CRITICAL vulns, FAIL otherwise.
    type: string
  - name: TRIVY_CRITICAL_COUNT
    description: Number of CRITICAL vulnerabilities found.
    type: string
  - name: TRIVY_HIGH_COUNT
    description: Number of HIGH vulnerabilities found.
    type: string
  - name: TRIVY_TOTAL_COUNT
    description: Total HIGH + CRITICAL vulnerabilities found.
    type: string
  - name: TRIVY_SARIF_PATH
    description: Path to the SARIF report file in the workspace.
    type: string
  steps:
  - name: trivy-scan
    image: $(params.TRIVY_IMAGE)
    workingDir: $(workspaces.manifest-dir.path)
    script: |
      #!/usr/bin/env sh
      set -e

      SARIF_OUTPUT="$(workspaces.manifest-dir.path)/trivy-report.sarif"

      #! ── Cache directory ────────────────────────────────────────────────
      #! Use the mounted PVC cache if available — avoids downloading 91MB
      #! of vulnerability DB on every run. Falls back to default location.
      CACHE_DIR="$HOME/.cache/trivy"
      if [ "$(workspaces.cache.bound)" = "true" ]; then
        CACHE_DIR="$(workspaces.cache.path)"
        echo "Using persistent Trivy cache at: $CACHE_DIR"
      else
        echo "No cache workspace bound — using default cache: $CACHE_DIR"
      fi

      SKIP_UPDATE=""

      #! ── Air-gapped setup ───────────────────────────────────────────────
      if [ "$(params.AIR_GAPPED_ENABLED)" = "true" ]; then
        echo "Air-Gapped mode enabled"
        TRIVY_TEMP_DIR=$(mktemp -d)
        trivy --cache-dir "$CACHE_DIR" image --download-db-only
        tar -cf ./db.tar.gz -C "$TRIVY_TEMP_DIR/db" metadata.json trivy.db
        rm -rf "$TRIVY_TEMP_DIR"
        mkdir -p "$CACHE_DIR/db"
        tar xvf ./db.tar.gz -C "$CACHE_DIR/db"
        SKIP_UPDATE="--skip-update"
      fi

      echo "Running trivy scan on $(params.IMAGE_PATH)"

      #! ── SARIF scan ─────────────────────────────────────────────────────
      #! --scanners vuln          : vulnerability scanning only
      #! --skip-java-db-update    : skip the 860MB Java DB download
      #! --cache-dir              : use persistent cache to avoid re-download
      trivy image \
        --cache-dir "$CACHE_DIR" \
        $SKIP_UPDATE \
        --exit-code 0 \
        --severity $(params.SEVERITY) \
        --scanners vuln \
        --skip-java-db-update \
        --timeout 10m \
        --format sarif \
        --output "$SARIF_OUTPUT" \
        $(params.IMAGE_PATH)

      #! ── Table scan (human-readable log output) ─────────────────────────
      trivy image \
        --cache-dir "$CACHE_DIR" \
        $SKIP_UPDATE \
        --exit-code 0 \
        --severity $(params.SEVERITY) \
        --scanners vuln \
        --skip-java-db-update \
        --timeout 10m \
        $(params.IMAGE_PATH)

      #! ── Extract counts from SARIF ──────────────────────────────────────
      #! SARIF severity mapping: error=CRITICAL, warning=HIGH
      critical=$(grep -o '"level":"error"' "$SARIF_OUTPUT" | wc -l | tr -d ' ')
      high=$(grep -o '"level":"warning"' "$SARIF_OUTPUT" | wc -l | tr -d ' ')
      total=$((critical + high))

      echo "CRITICAL: $critical"
      echo "HIGH:     $high"
      echo "TOTAL:    $total"
      echo "SARIF:    $SARIF_OUTPUT"

      #! ── Write results ──────────────────────────────────────────────────
      if [ "$total" -eq 0 ]; then
        printf 'PASS' > $(results.TRIVY_SCAN_SUMMARY.path)
      else
        printf 'FAIL' > $(results.TRIVY_SCAN_SUMMARY.path)
      fi

      printf '%s' "$critical"     > $(results.TRIVY_CRITICAL_COUNT.path)
      printf '%s' "$high"         > $(results.TRIVY_HIGH_COUNT.path)
      printf '%s' "$total"        > $(results.TRIVY_TOTAL_COUNT.path)
      printf '%s' "$SARIF_OUTPUT" > $(results.TRIVY_SARIF_PATH.path)

      echo "Scan complete — SUMMARY=$(cat $(results.TRIVY_SCAN_SUMMARY.path))"
