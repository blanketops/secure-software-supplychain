apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: trivy-scanner
  labels:
    app.kubernetes.io/version: "0.2"
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/categories: Security
    tekton.dev/tags: CLI, trivy
    tekton.dev/displayName: "trivy scanner"
    tekton.dev/platforms: "linux/amd64,linux/arm64,linux/ppc64le,linux/390x"
spec:
  description: >-
    Trivy scanner with SARIF output and rich result extraction. Scans container images for vulnerabilities and emits structured results and a SARIF report for downstream consumption.
  workspaces:
  - name: manifest-dir
  params:
  - name: TRIVY_IMAGE
    default: docker.io/aquasec/trivy@sha256:944a044451791617cc0ed2ee4d1942a4f66b790d527fcd0575a6b399ccbc05a1
    description: Trivy scanner image to be used
  - name: IMAGE_PATH
    description: Image or Path to be scanned by trivy.
    type: string
  - name: SEVERITY
    default: "HIGH,CRITICAL"
    description: Severities to scan for
    type: string
  - name: AIR_GAPPED_ENABLED
    default: "false"
    description: Enable Air-Gapped mode
    type: string
  results:
  - name: TRIVY_SCAN_SUMMARY
    description: PASS if no HIGH/CRITICAL vulns, FAIL otherwise
    type: string
  - name: TRIVY_CRITICAL_COUNT
    description: Number of CRITICAL vulnerabilities found
    type: string
  - name: TRIVY_HIGH_COUNT
    description: Number of HIGH vulnerabilities found
    type: string
  - name: TRIVY_TOTAL_COUNT
    description: Total HIGH + CRITICAL vulnerabilities found
    type: string
  - name: TRIVY_SARIF_PATH
    description: Path to the SARIF report file in the workspace
    type: string
  steps:
  - name: trivy-scan
    image: $(params.TRIVY_IMAGE)
    workingDir: $(workspaces.manifest-dir.path)
    script: |
      #!/usr/bin/env sh
      set -e

      SARIF_OUTPUT="$(workspaces.manifest-dir.path)/trivy-report.sarif"

      # Air-gapped setup — preserve as-is
      if [ "$(params.AIR_GAPPED_ENABLED)" = "true" ]; then
        echo "Air-Gapped mode enabled"
        TRIVY_TEMP_DIR=$(mktemp -d)
        trivy --cache-dir "$TRIVY_TEMP_DIR" image --download-db-only
        tar -cf ./db.tar.gz -C "$TRIVY_TEMP_DIR/db" metadata.json trivy.db
        rm -rf "$TRIVY_TEMP_DIR"
        mkdir -p "$HOME"/.cache/trivy/db
        tar xvf ./db.tar.gz -C "$HOME"/.cache/trivy/db
        SKIP_UPDATE="--skip-update"
      fi

      # Run scan — SARIF output for rich structured report
      echo "Running trivy scan on $(params.IMAGE_PATH)"
      trivy image \
        $SKIP_UPDATE \
        --exit-code 0 \
        --severity $(params.SEVERITY) \
        --format sarif \
        --output "$SARIF_OUTPUT" \
        $(params.IMAGE_PATH)

      # Also print human readable table to logs
      trivy image \
        $SKIP_UPDATE \
        --exit-code 0 \
        --severity $(params.SEVERITY) \
        $(params.IMAGE_PATH)

      # Extract counts from SARIF
      # SARIF rules map 1:1 to findings — count by severity level
      critical=$(grep -o '"level":"error"' "$SARIF_OUTPUT" | wc -l | tr -d ' ')
      high=$(grep -o '"level":"warning"' "$SARIF_OUTPUT" | wc -l | tr -d ' ')
      total=$((critical + high))

      echo "CRITICAL: $critical"
      echo "HIGH: $high"
      echo "TOTAL: $total"
      echo "SARIF report: $SARIF_OUTPUT"

      # Write results
      if [ "$total" -eq 0 ]; then
        printf 'PASS' > $(results.TRIVY_SCAN_SUMMARY.path)
      else
        printf 'FAIL' > $(results.TRIVY_SCAN_SUMMARY.path)
      fi

      printf '%s' "$critical"    > $(results.TRIVY_CRITICAL_COUNT.path)
      printf '%s' "$high"        > $(results.TRIVY_HIGH_COUNT.path)
      printf '%s' "$total"       > $(results.TRIVY_TOTAL_COUNT.path)
      printf '%s' "$SARIF_OUTPUT" > $(results.TRIVY_SARIF_PATH.path)

      echo "Scan complete — SUMMARY=$(cat $(results.TRIVY_SCAN_SUMMARY.path))"
