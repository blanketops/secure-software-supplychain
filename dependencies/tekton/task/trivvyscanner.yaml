apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: trivy-scanner
  namespace: default
  labels:
    app.kubernetes.io/version: "0.4"
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/categories: Security
    tekton.dev/tags: CLI, trivy
    tekton.dev/displayName: "trivy scanner"
    tekton.dev/platforms: "linux/amd64,linux/arm64,linux/ppc64le,linux/390x"
spec:
  description: >-
    Trivy scanner with SARIF output and rich result extraction. Scans container images for vulnerabilities and emits structured results and a SARIF report for downstream consumption.

    The default TRIVY_IMAGE is a custom image with the vulnerability DB pre-baked at build time (docker.io/nkanyezisolutions/trivy-db:latest). This eliminates the 91MB + 861MB DB downloads on every pipeline run.

    Counts are extracted from the Trivy table output (Total: N (HIGH: N, CRITICAL: N)) rather than SARIF level fields, which vary across Trivy versions.

    The task fails when any CRITICAL vulnerability is found, so the image is never signed or attested. HIGH findings are reported but do not fail it. The results and the SARIF report are written before the task fails.
  workspaces:
  - name: manifest-dir
    description: Workspace for source and SARIF report output.
  params:
  - name: TRIVY_IMAGE
    default: docker.io/nkanyezisolutions/trivy-db:latest
    description: |
      Trivy scanner image to use. Default is a custom image with the
      vulnerability DB pre-baked to avoid downloading 91MB on every run.
    type: string
  - name: IMAGE_PATH
    description: Image or path to be scanned by trivy.
    type: string
  - name: IMAGE_TAR
    default: ""
    description: |
      Image archive to scan instead of pulling IMAGE_PATH, relative to the
      manifest-dir workspace. Lets the image be scanned before it is pushed,
      so one with critical vulnerabilities is never published.
    type: string
  - name: SEVERITY
    default: "HIGH,CRITICAL"
    description: Severities to scan for.
    type: string
  results:
  - name: TRIVY_SCAN_SUMMARY
    description: PASS if no HIGH/CRITICAL vulns, FAIL otherwise.
    type: string
  - name: TRIVY_CRITICAL_COUNT
    description: Number of CRITICAL vulnerabilities found.
    type: string
  - name: TRIVY_HIGH_COUNT
    description: Number of HIGH vulnerabilities found.
    type: string
  - name: TRIVY_TOTAL_COUNT
    description: Total HIGH + CRITICAL vulnerabilities found.
    type: string
  - name: TRIVY_SARIF_PATH
    description: Path to the SARIF report file in the workspace.
    type: string
  steps:
  - name: trivy-scan
    image: $(params.TRIVY_IMAGE)
    workingDir: $(workspaces.manifest-dir.path)
    script: |
      #!/usr/bin/env sh
      set -e

      SARIF_OUTPUT="$(workspaces.manifest-dir.path)/trivy-report.sarif"

      # ── DB cache ───────────────────────────────────────────────────────
      # TRIVY_CACHE_DIR is set in the baked image to /trivy-db.
      # --skip-db-update prevents any network calls during the scan.
      CACHE_DIR="${TRIVY_CACHE_DIR:-$HOME/.cache/trivy}"
      echo "Trivy cache dir: $CACHE_DIR"

      # ── What to scan ───────────────────────────────────────────────────
      # The local build archive when one is given, else the registry image.
      if [ -n "$(params.IMAGE_TAR)" ]; then
        TARGET="--input $(params.IMAGE_TAR)"
        echo "Running trivy scan on archive $(params.IMAGE_TAR) (built as $(params.IMAGE_PATH))"
      else
        TARGET="$(params.IMAGE_PATH)"
        echo "Running trivy scan on $(params.IMAGE_PATH)"
      fi

      # ── SARIF scan — for structured report output ──────────────────────
      trivy image \
        --cache-dir "$CACHE_DIR" \
        --skip-db-update \
        --skip-java-db-update \
        --exit-code 0 \
        --severity $(params.SEVERITY) \
        --scanners vuln \
        --timeout 10m \
        --format sarif \
        --output "$SARIF_OUTPUT" \
        $TARGET

      # ── Table scan — capture output for count extraction ───────────────
      # Trivy table output includes a summary line:
      #   Total: 175 (HIGH: 149, CRITICAL: 26)
      # Extract counts from this line — more reliable than SARIF level
      # fields which vary across Trivy versions.
      SCAN_OUTPUT=$(trivy image \
        --cache-dir "$CACHE_DIR" \
        --skip-db-update \
        --skip-java-db-update \
        --exit-code 0 \
        --severity $(params.SEVERITY) \
        --scanners vuln \
        --timeout 10m \
        $TARGET 2>&1)

      echo "$SCAN_OUTPUT"

      # ── Extract counts from table summary line ─────────────────────────
      critical=$(echo "$SCAN_OUTPUT" | grep -oE 'CRITICAL: [0-9]+' | grep -oE '[0-9]+$' | tail -1)
      high=$(echo "$SCAN_OUTPUT" | grep -oE 'HIGH: [0-9]+' | grep -oE '[0-9]+$' | tail -1)

      # Default to 0 if not found (clean image with no findings)
      critical=${critical:-0}
      high=${high:-0}
      total=$((critical + high))

      echo "CRITICAL: $critical"
      echo "HIGH:     $high"
      echo "TOTAL:    $total"
      echo "SARIF:    $SARIF_OUTPUT"

      # ── Write results ──────────────────────────────────────────────────
      if [ "$total" -eq 0 ]; then
        printf 'PASS' > $(results.TRIVY_SCAN_SUMMARY.path)
      else
        printf 'FAIL' > $(results.TRIVY_SCAN_SUMMARY.path)
      fi

      printf '%s' "$critical"     > $(results.TRIVY_CRITICAL_COUNT.path)
      printf '%s' "$high"         > $(results.TRIVY_HIGH_COUNT.path)
      printf '%s' "$total"        > $(results.TRIVY_TOTAL_COUNT.path)
      printf '%s' "$SARIF_OUTPUT" > $(results.TRIVY_SARIF_PATH.path)

      echo "Scan complete — SUMMARY=$(cat $(results.TRIVY_SCAN_SUMMARY.path))"

      # ── Gate ───────────────────────────────────────────────────────────
      # Runs last, so the counts and the SARIF report above are recorded
      # even when the build is stopped here.
      if [ "$critical" -gt 0 ]; then
        echo "FAILED: $critical CRITICAL vulnerabilities found in $(params.IMAGE_PATH)."
        echo "The image will not be signed. See $SARIF_OUTPUT for details."
        exit 1
      fi
