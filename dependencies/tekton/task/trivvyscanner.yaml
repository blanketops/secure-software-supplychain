apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: trivy-scanner
  namespace: default
  labels:
    app.kubernetes.io/version: "0.3"
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/categories: Security
    tekton.dev/tags: CLI, trivy
    tekton.dev/displayName: "trivy scanner"
    tekton.dev/platforms: "linux/amd64,linux/arm64,linux/ppc64le,linux/390x"
spec:
  description: >-
    Trivy scanner with SARIF output and rich result extraction. Scans container images for vulnerabilities and emits structured results and a SARIF report for downstream consumption.

    The default TRIVY_IMAGE is a custom image with the vulnerability DB pre-baked at build time (docker.io/nkanyezisolutions/trivy-db:latest). This eliminates the 91MB + 861MB DB downloads on every pipeline run. Set TRIVY_IMAGE to the upstream trivy image if you want live DB updates.

    To rebuild the baked image:
      docker build -t docker.io/nkanyezisolutions/trivy-db:latest \
        dependencies/tekton/task/trivy-db/
      docker push docker.io/nkanyezisolutions/trivy-db:latest
  workspaces:
  - name: manifest-dir
    description: Workspace for source and SARIF report output.
  params:
  - name: TRIVY_IMAGE
    # Custom image with vulnerability DB pre-baked — no download on first run.
    # Rebuild periodically to refresh the DB (weekly or monthly).
    # See dependencies/tekton/task/trivy-db/Dockerfile
    default: docker.io/nkanyezisolutions/trivy-db:latest
    description: |
      Trivy scanner image to use. Default is a custom image with the
      vulnerability DB pre-baked to avoid downloading 91MB on every run.
    type: string
  - name: IMAGE_PATH
    description: Image or path to be scanned by trivy.
    type: string
  - name: SEVERITY
    default: "HIGH,CRITICAL"
    description: Severities to scan for.
    type: string
  results:
  - name: TRIVY_SCAN_SUMMARY
    description: PASS if no HIGH/CRITICAL vulns, FAIL otherwise.
    type: string
  - name: TRIVY_CRITICAL_COUNT
    description: Number of CRITICAL vulnerabilities found.
    type: string
  - name: TRIVY_HIGH_COUNT
    description: Number of HIGH vulnerabilities found.
    type: string
  - name: TRIVY_TOTAL_COUNT
    description: Total HIGH + CRITICAL vulnerabilities found.
    type: string
  - name: TRIVY_SARIF_PATH
    description: Path to the SARIF report file in the workspace.
    type: string
  steps:
  - name: trivy-scan
    image: $(params.TRIVY_IMAGE)
    workingDir: $(workspaces.manifest-dir.path)
    script: |
      #!/usr/bin/env sh
      set -e

      SARIF_OUTPUT="$(workspaces.manifest-dir.path)/trivy-report.sarif"

      # ── DB cache ───────────────────────────────────────────────────────
      # TRIVY_CACHE_DIR is set in the baked image to /trivy-db where the
      # DB was pre-downloaded at image build time. --skip-db-update and
      # --skip-java-db-update prevent any network calls during the scan.
      # If using the upstream trivy image, remove these flags.
      CACHE_DIR="${TRIVY_CACHE_DIR:-$HOME/.cache/trivy}"
      echo "Trivy cache dir: $CACHE_DIR"

      echo "Running trivy scan on $(params.IMAGE_PATH)"

      # ── SARIF scan ─────────────────────────────────────────────────────
      # --scanners vuln          : vulnerability scanning only (no secrets/misconfig)
      # --skip-db-update         : use pre-baked DB, no download
      # --skip-java-db-update    : skip 861MB Java DB entirely
      # --timeout 10m            : generous timeout for large images
      trivy image \
        --cache-dir "$CACHE_DIR" \
        --skip-db-update \
        --exit-code 0 \
        --severity $(params.SEVERITY) \
        --scanners vuln \
        --timeout 10m \
        --format sarif \
        --output "$SARIF_OUTPUT" \
        $(params.IMAGE_PATH)

      # ── Table scan (human-readable log output) ─────────────────────────
      trivy image \
        --cache-dir "$CACHE_DIR" \
        --skip-db-update \
        --exit-code 0 \
        --severity $(params.SEVERITY) \
        --scanners vuln \
        --timeout 10m \
        $(params.IMAGE_PATH)

      # ── Extract counts from SARIF ──────────────────────────────────────
      # SARIF severity mapping: error=CRITICAL, warning=HIGH
      critical=$(grep -o '"level":"error"' "$SARIF_OUTPUT" | wc -l | tr -d ' ')
      high=$(grep -o '"level":"warning"' "$SARIF_OUTPUT" | wc -l | tr -d ' ')
      total=$((critical + high))

      echo "CRITICAL: $critical"
      echo "HIGH:     $high"
      echo "TOTAL:    $total"
      echo "SARIF:    $SARIF_OUTPUT"

      # ── Write results ──────────────────────────────────────────────────
      if [ "$total" -eq 0 ]; then
        printf 'PASS' > $(results.TRIVY_SCAN_SUMMARY.path)
      else
        printf 'FAIL' > $(results.TRIVY_SCAN_SUMMARY.path)
      fi

      printf '%s' "$critical"     > $(results.TRIVY_CRITICAL_COUNT.path)
      printf '%s' "$high"         > $(results.TRIVY_HIGH_COUNT.path)
      printf '%s' "$total"        > $(results.TRIVY_TOTAL_COUNT.path)
      printf '%s' "$SARIF_OUTPUT" > $(results.TRIVY_SARIF_PATH.path)

      echo "Scan complete — SUMMARY=$(cat $(results.TRIVY_SCAN_SUMMARY.path))"
