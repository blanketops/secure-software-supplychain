# Vault over HTTPS.
#
# Vault listens on its pod's loopback address, where nothing outside the pod
# can reach it, and the "tls" container in the same pod serves it on 8443 with
# a certificate from the supply chain's CA. The Service exposes only that, as
# port 8200. It is set up as the sigstore services are, so that a renewed
# certificate is picked up without restarting Vault, which would seal it.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-tls
  namespace: vault
spec:
  secretName: vault-tls
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - server auth
  dnsNames:
    - vault
    - vault.vault
    - vault.vault.svc
    - vault.vault.svc.cluster.local
  issuerRef:
    name: supply-chain-ca
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-tls-proxy
  namespace: vault
data:
  default.conf: |
    server {
      listen 8443 ssl;
      ssl_certificate     /tls/tls.crt;
      ssl_certificate_key /tls/tls.key;
      ssl_protocols       TLSv1.2 TLSv1.3;

      location / {
        proxy_pass http://127.0.0.1:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
      }
    }
  run.sh: |
    # nginx reads a certificate when it starts. cert-manager renews it in
    # place, so nginx is told to read it again every hour.
    nginx -g 'daemon off;' &
    nginx_pid=$!
    trap 'kill -QUIT "$nginx_pid"; wait "$nginx_pid"; exit 0' TERM INT
    while kill -0 "$nginx_pid" 2>/dev/null; do
      sleep 3600 &
      wait $!
      nginx -s reload 2>/dev/null || true
    done
