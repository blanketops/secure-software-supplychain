# Logging in to Vault with a SPIFFE identity, when the stack is installed with
# --signing-identity spiffe. Vault trusts SPIRE's OIDC discovery endpoint and
# gives a token to one SPIFFE ID only:
#
#   spiffe://<trust domain>/ns/vault/sa/supply-chain-secrets
#
# as described in https://spiffe.io/docs/latest/keyless/vault/readme/.
#
# External Secrets cannot ask the SPIFFE Workload API for a JWT-SVID itself; it
# reads the JWT it presents to Vault from a Secret. This Deployment is the
# bridge. It runs as the ServiceAccount the SPIFFE ID belongs to, so SPIRE
# issues it that identity. "svid" keeps a current JWT-SVID, made for the
# audience "vault", in a file; "publish" copies it into the Secret
# supply-chain-vault-jwt, which the ClusterSecretStore names. The JWT is valid
# for ten minutes and replaced after five, and Vault accepts nothing else.
#
# No long-lived credential is involved: there is no token to create, store or
# rotate, and deleting the SPIRE entry ends the access.
---
apiVersion: v1
kind: Namespace
metadata:
  name: vault
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: supply-chain-secrets
  namespace: vault
---
# The one thing the bridge may do in the cluster: keep one Secret up to date.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: supply-chain-svid
  namespace: vault
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["supply-chain-vault-jwt"]
    verbs: ["get", "patch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: supply-chain-svid
  namespace: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: supply-chain-svid
subjects:
  - kind: ServiceAccount
    name: supply-chain-secrets
    namespace: vault
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: supply-chain-svid
  namespace: vault
data:
  helper.conf: |
    agent_address = "/spiffe-workload-api/spire-agent.sock"
    daemon_mode = true
    cert_dir = "/svid"
    jwt_svids = [{ jwt_audience = "vault", jwt_svid_file_name = "jwt" }]
  publish.sh: |
    # Copies the current JWT-SVID into the Secret, and keeps doing so: an
    # identical copy changes nothing, and a Secret that was deleted or emptied
    # is put back within seconds.
    api=https://kubernetes.default.svc
    sa=/var/run/secrets/kubernetes.io/serviceaccount
    while true; do
      if [ -s /svid/jwt ]; then
        code=$(curl -sS -o /tmp/response -w '%{http_code}' \
          --cacert "$sa/ca.crt" -H "Authorization: Bearer $(cat "$sa/token")" \
          -H 'Content-Type: application/apply-patch+yaml' -X PATCH \
          "$api/api/v1/namespaces/vault/secrets/supply-chain-vault-jwt?fieldManager=supply-chain-svid&force=true" \
          --data "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"supply-chain-vault-jwt\"},\"stringData\":{\"jwt\":\"$(cat /svid/jwt)\"}}")
        case "$code" in
          200|201) touch /tmp/published ;;
          *) echo "Could not publish the JWT-SVID: HTTP $code"; rm -f /tmp/published ;;
        esac
      else
        echo "Waiting for SPIRE to issue a JWT-SVID"
      fi
      sleep 10
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supply-chain-svid
  namespace: vault
  labels:
    app.kubernetes.io/name: supply-chain-svid
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: supply-chain-svid
  template:
    metadata:
      annotations:
        # Changing this restarts the pod, so that it fetches a JWT-SVID with
        # the issuer SPIRE now writes.
        supply-chain.blanketops.dev/jwt-issuer: https
      labels:
        app.kubernetes.io/name: supply-chain-svid
    spec:
      serviceAccountName: supply-chain-secrets
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: svid
          image: ghcr.io/spiffe/spiffe-helper:0.10.1
          args: ["-config", "/config/helper.conf"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
            - name: config
              mountPath: /config
            - name: svid
              mountPath: /svid
        - name: publish
          image: docker.io/curlimages/curl:8.17.0@sha256:935d9100e9ba842cdb060de42472c7ca90cfe9a7c96e4dacb55e79e560b3ff40
          command: ["/bin/sh", "/config/publish.sh"]
          # Ready means External Secrets has a current JWT-SVID to present.
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/published"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /config
            - name: svid
              mountPath: /svid
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: config
          configMap:
            name: supply-chain-svid
        - name: svid
          emptyDir:
            medium: Memory
        - name: tmp
          emptyDir: {}
