<text x="420" y="496" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" fill="#1a7f5a" text-anchor="middle" font-weight="600">waits, polling the tag</text>
