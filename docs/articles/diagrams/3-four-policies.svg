<text x="22" y="34" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#1f2933" text-anchor="start" font-weight="600">One SupplyChainPolicy renders four policies. An image must pass all of them.</text>
