<text x="640" y="113" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" fill="#1f2933" text-anchor="middle" font-weight="600">authorization</text>
<text x="640" y="134" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" fill="#5f6c7b" text-anchor="middle" font-weight="400">attests the 3 reviews</text>
