apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: for-kaniko-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/blanketops/secure-software-supplychain.git
    targetRevision: main
    path: gitops/for-kaniko-app
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Admission refuses the pods until the policy app's policies exist.
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
