apiVersion: apps/v1
kind: Deployment
metadata:
  name: for-kaniko-app
spec:
  replicas: 1
  template:
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: web
        # Built from ntlaletsi70/for-kaniko-app@secure (8e91632) under the SPIFFE
        # signing identity, with an attested SBOM. Pinned by digest: admission
        # verifies exactly this image.
        image: docker.io/nkanyezisolutions/for-kaniko-app@sha256:790f6d621d82a53b4eaf429b456f8b135a3efd2c14a2671272a7d7d557938104
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: http
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
