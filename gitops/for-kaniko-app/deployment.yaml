apiVersion: apps/v1
kind: Deployment
metadata:
  name: for-kaniko-app
spec:
  replicas: 1
  template:
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: web
        # Built from ntlaletsi70/for-kaniko-app@secure (df65c59) under the SPIFFE
        # signing identity, with an attested SBOM. Pinned by digest: admission
        # verifies exactly this image.
        image: docker.io/nkanyezisolutions/for-kaniko-app@sha256:e57d9d4bddb555fa8e9b4b30d768cd5332e9915c572381ccd738abbbd508fb18
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: http
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
