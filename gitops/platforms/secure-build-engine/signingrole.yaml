# config/rbac/signing_role.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secure-software-supply-chain-image-signer
rules:
- apiGroups: [ "supplychain.blanketops.dev" ]
  resources: [ "supplychains" ]
  verbs: [ "get" ]
- apiGroups: [ "supplychain.blanketops.dev" ]
  resources: [ "imagesignatures" ]
  verbs: [ "create" ]
- apiGroups: [ "supplychain.blanketops.dev" ]
  resources: [ "imagebuilds" ]
  verbs: [ "create" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secure-software-supply-chain-image-signer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secure-software-supply-chain-image-signer
subjects:
- kind: ServiceAccount
  name: supply-chain-runner
  namespace: default
