# Minimal stand-ins for the sigstore policy-controller CRDs, so envtest can
# serve the resources SupplyChainPolicy renders. Not installed anywhere else.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: trustroots.policy.sigstore.dev
spec:
  group: policy.sigstore.dev
  scope: Cluster
  names:
    kind: TrustRoot
    listKind: TrustRootList
    plural: trustroots
    singular: trustroot
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusterimagepolicies.policy.sigstore.dev
spec:
  group: policy.sigstore.dev
  scope: Cluster
  names:
    kind: ClusterImagePolicy
    listKind: ClusterImagePolicyList
    plural: clusterimagepolicies
    singular: clusterimagepolicy
  versions:
  - name: v1beta1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        x-kubernetes-preserve-unknown-fields: true
